name: CI/CD - API REST

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================================================
  # 1. PRUEBAS Y COBERTURA
  # =========================================================
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run test:coverage


  # =========================================================
  # 2. CONSTRUIR Y PUBLICAR IMAGEN EN DOCKER HUB
  # =========================================================
  docker:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest

    needs: test

    # Docker solo se publica cuando hacemos push a main.
    # Un pull_request únicamente ejecuta las pruebas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            pao1606/webapp-api-node:latest
            pao1606/webapp-api-node:${{ github.sha }}


  # =========================================================
  # 3. DESPLIEGUE AUTOMÁTICO EN AWS EC2
  # =========================================================
  deploy:
  name: Desplegar en AWS EC2
  runs-on: ubuntu-latest

  needs: docker

  if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  steps:
    - name: Conectar a EC2 y desplegar
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22

        script: |
          set -e

          IMAGE="pao1606/webapp-api-node:latest"
          CONTAINER="webapp-api-node"

          echo "=========================================="
          echo "DESCARGANDO IMAGEN DESDE DOCKER HUB"
          echo "=========================================="

          sudo docker pull "$IMAGE"


          echo "=========================================="
          echo "ELIMINANDO CONTENEDOR ANTERIOR"
          echo "=========================================="

          sudo docker rm -f "$CONTAINER" 2>/dev/null || true


          echo "=========================================="
          echo "INICIANDO NUEVA VERSION"
          echo "=========================================="

          sudo docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 80:80 \
            "$IMAGE"


          echo "=========================================="
          echo "ESPERANDO INICIO DE LA API"
          echo "=========================================="

          sleep 5


          echo "=========================================="
          echo "COMPROBANDO API REST"
          echo "=========================================="

          curl -f http://127.0.0.1/ || exit 1


          echo "=========================================="
          echo "CONTENEDOR ACTIVO"
          echo "=========================================="

          sudo docker ps --filter "name=$CONTAINER"


          echo "=========================================="
          echo "DESPLIEGUE FINALIZADO CORRECTAMENTE"
          echo "=========================================="