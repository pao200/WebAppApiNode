name: CI/CD - API REST

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run test:coverage


  docker:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            pao1606/webapp-api-node:latest
            pao1606/webapp-api-node:${{ github.sha }}


  deploy:
    name: Desplegar en AWS EC2
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Conectar a EC2 y desplegar
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            IMAGE="pao1606/webapp-api-node:latest"
            CONTAINER="webapp-api-node"

            echo "=========================================="
            echo "DESCARGANDO IMAGEN DESDE DOCKER HUB"
            echo "=========================================="

            sudo docker pull "$IMAGE"

            echo "=========================================="
            echo "ELIMINANDO CONTENEDOR ANTERIOR"
            echo "=========================================="

            sudo docker rm -f "$CONTAINER" 2>/dev/null || true

            echo "=========================================="
            echo "INICIANDO NUEVA VERSION"
            echo "=========================================="

            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            echo "=========================================="
            echo "ESPERANDO INICIO DE LA API"
            echo "=========================================="

            sleep 5

            echo "=========================================="
            echo "COMPROBANDO API REST"
            echo "=========================================="

            curl -f http://127.0.0.1/api/health || exit 1

            echo "=========================================="
            echo "CONTENEDOR ACTIVO"
            echo "=========================================="

            sudo docker ps --filter "name=$CONTAINER"

            echo "=========================================="
            echo "DESPLIEGUE FINALIZADO CORRECTAMENTE"
            echo "=========================================="